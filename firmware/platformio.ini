; Aranet4 -> Cloudflare bridge. Pick the env that matches your board:
; feather_v2  Adafruit Feather ESP32 V2 (this one; status light is its NeoPixel)
;   esp32dev  classic ESP32 / ESP32-WROOM / ESP32-WROVER boards (USB chip CP2102 or CH340)
;   esp32c3   ESP32-C3 boards
;   esp32s3   ESP32-S3 boards
[platformio]
default_envs = feather_v2

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps = h2zero/NimBLE-Arduino@2.1.0
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:feather_v2]
board = adafruit_feather_esp32_v2
